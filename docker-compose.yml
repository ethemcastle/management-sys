# Local-dev orchestration for Cadence (backend API + Angular frontend).
# Usage:  docker compose up --build
#   API   -> http://localhost:8000  (docs at /docs)
#   App   -> http://localhost:4200
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Allow the browser app to call the API cross-origin.
      CADENCE_CORS_ORIGINS: '["http://localhost:4200"]'
      CADENCE_SEED_ON_STARTUP: "true"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      # The dev-server proxy (proxy.conf.js) forwards /api to the backend service.
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start -- --host 0.0.0.0 --poll 2000
