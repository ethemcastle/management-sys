# Production-style run of risr/crm — baked images (no source mounts), the Angular
# app compiled and served by nginx, and a persistent volume for the SQLite DB.
# The exact same setup runs on your laptop and on a VPS.
#
#   Run:    docker compose -f docker-compose.prod.yml up --build -d
#   Open:   http://localhost:8080
#   Stop:   docker compose -f docker-compose.prod.yml down
#
# Integration secrets (GitHub / monday / Google / Ybug / AI) load from backend/.env.
name: cadence-prod

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Keep the database on the named volume, not inside the image, so data
      # survives rebuilds and redeploys.
      CADENCE_DATABASE_URL: "sqlite:////data/cadence.db"
      CADENCE_SEED_ON_STARTUP: "true"
    volumes:
      - cadence-db:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # Public HTTPS URL via a Cloudflare quick tunnel → the app + /api (so Ybug can
  # reach /api/ybug/webhook). run.sh prints the URL. It changes on each restart;
  # for a permanent URL use a named Cloudflare tunnel or your own domain.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  cadence-db:
